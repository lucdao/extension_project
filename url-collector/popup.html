<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: sans-serif; padding: 10px; }
    h3 { margin-top: 0; text-align: center;}
    .stats { background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center; }
    .count { font-size: 24px; font-weight: bold; color: #007bff; }
    button { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white;}
    #btnToggle { background-color: #4CAF50; } /* Xanh */
    #btnToggle.stop { background-color: #f44336; } /* Đỏ */
    #btnDownload { background-color: #2196F3; }
    #btnClear { background-color: #607d8b; font-size: 12px; padding: 5px; }
    small { color: #666; display: block; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>
  <h3>Continuous Collector</h3>
  
  <div class="stats">
    <div>Link đã lưu trong kho:</div>
    <div id="totalCount" class="count">0</div>
  </div>

  <button id="btnToggle">BẮT ĐẦU QUÉT</button>
  <button id="btnDownload">TẢI CSV (Tất cả)</button>
  <button id="btnClear">Xóa sạch dữ liệu</button>

  <small>Dữ liệu được lưu nối tiếp liên tục.</small>

  <script src="popup.js"></script>
</body>
</html>
